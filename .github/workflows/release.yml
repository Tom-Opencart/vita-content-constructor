name: release

# Авторелиз: пуш аннотированного тега v* -> сборка + смоуки -> GitHub Release
# с заметками из CHANGELOG.md. Раздел ищется по версии тега: v0.8.5 читает
# «## [0.8.5]», при отсутствии раздела релиз НЕ создаётся (гейт против
# «тега без changelog»). Джобы build-and-smoke и publish независимы, поэтому
# publish добавлен в need без веток: ветки у workflow release нет.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-smoke:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build-and-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract CHANGELOG section for tag
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          python3 - "$ver" <<'PY'
          import io, re, sys
          ver = sys.argv[1]
          text = io.open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## \[' + re.escape(ver) + r'\]([^\n]*)\n(.*?)(?=^## \[|\Z)', text, re.M | re.S)
          if not m:
              print('::error::В CHANGELOG.md нет раздела «## [' + ver + ']» — оформите раздел перед тегом.')
              sys.exit(1)
          body = m.group(2).strip() + '\n'
          io.open('release-notes.md', 'w', encoding='utf-8').write(body)
          print('section found: %s chars' % len(body))
          PY
          echo "file=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG уже существует — пропускаю создание."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --latest

      - name: Cleanup
        if: always()
        run: rm -f release-notes.md
